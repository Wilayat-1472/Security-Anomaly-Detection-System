model:
  name: "mobilenetv2"       # Options: mobilenetv2, convnext_tiny, resnet50
  num_classes: 5
  pretrained: true
  freeze_backbone: false    # If true, freezes feature extraction layers to preserve ImageNet representations
  dropout: 0.3
  input_size: 224

classes:
  - normal
  - weapons
  - masks
  - fire
  - smoke

data:
  data_dir: "data"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1
  batch_size: 16
  num_workers: 2
  input_size: 224
  random_seed: 42

training:
  epochs: 35
  optimizer: "adamw"         # Options: adamw, sgd, adam
  learning_rate: 0.0003
  weight_decay: 0.0001
  momentum: 0.9              # for SGD
  loss_type: "focal"         # Options: focal, weighted_ce, ce
  focal_gamma: 2.0
  label_smoothing: 0.1
  scheduler: "cosine"        # Options: cosine, step
  min_lr: 0.000001
  scheduler_step: 7
  scheduler_gamma: 0.1
  grad_clip: 1.0
  early_stop_patience: 12
  use_amp: false             # Set true on modern CUDA devices for faster mixed-precision training
  save_dir: "checkpoints"

augmentation:
  random_horizontal_flip: true
  random_rotation: 15
  random_perspective: 0.2
  color_jitter: 0.3
  random_affine: 10
  random_erasing: 0.2
  normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]

evaluation:
  metrics: ["accuracy", "precision", "recall", "f1", "fpr", "specificity", "confusion_matrix"]
  save_confusion_matrix: true

inference:
  confidence_threshold: 0.60
  top_k: 3
  explainability: "gradcam"  # Options: gradcam, none
